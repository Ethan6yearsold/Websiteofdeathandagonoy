<!doctype html>

<html lang="en">

<head>
<meta charset="utf-8">
<title>grid demo</title>

<style>
    .container {  display: grid;
  grid-template-columns: 0.5fr 2fr 0.5fr;
  grid-template-rows: 300px 200px 1fr;
  gap: 0px 0px;
  grid-auto-flow: row;
  grid-template-areas:
    "header header header"
    "sideleft main sidelight"
    "sideleft main sidelight";
}

.header { grid-area: header;
background-image: url(markypoo.png);background-repeat: no-repeat;background-position: center;background-size: cover;background-attachment: scroll; }

.sideleft { grid-area: sideleft; 
background-image: url(nomarkno.png);height: 500px; width: 300px;background-position: center;background-position: top;}
.sidelight { grid-area: sidelight;
    background-image: url(nomarkno.png);height: 500px; width: 300px;background-position: center;background-position: top; }

.main { grid-area: main; 
background-image:url(heart-locket.gif);}


</style>
    

</head>

<body>
    <div class="container">
        <div class="header">
            <h1 style="text-align: center; scroll-behavior: smooth ;">Header? I hardly know her!</h1>
            <img src="markskooter.gif" style="width:200px";>

        </div>
        
        <div class="sideleft">
            <img src="Marchick.png" style="width: 30px; margin-top: 400px;">
            <img src="nomarkno.png" style="width: 300px; margin-top: -200px;">
        </div>
        <div class="sidelight"></div>
        <div class="main"></div>
      </div>
      
</body>



</html>
